name: car_air_monitor
description: "Ứng dụng di động giám sát không khí cabin ô tô (ESP32 + T6703 + SHT35)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Quản lý Bluetooth Low Energy (BLE) với ESP32
  flutter_blue_plus: ^1.34.5

  # Quản lý Wi-Fi WebSocket & HTTP REST
  http: ^1.2.1
  web_socket_channel: ^3.0.1

  # Cảnh báo giọng nói tiếng Việt cho tài xế
  flutter_tts: ^4.0.2

  # Giữ màn hình điện thoại luôn sáng khi gắn trên xe
  wakelock_plus: ^1.2.8

  # Quản lý trạng thái
  provider: ^6.1.2

  # Vẽ biểu đồ chuyến đi thời gian thực
  fl_chart: ^0.68.0

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
