name: Build iOS IPA (AtmoCar)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Prepare iOS Project Platform
        working-directory: flutter_mobile_app
        run: |
          # 1. Tạo platform iOS nếu chưa có
          if [ ! -d "ios" ]; then
            echo "Creating iOS project platform..."
            flutter create . --platforms=ios --org=com.atmocar
          fi

          # 2. Cập nhật Info.plist
          INFO_PLIST="ios/Runner/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            echo "Injecting iOS Permissions into Info.plist..."
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AtmoCar" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string AtmoCar" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'AtmoCar can ket noi Bluetooth BLE de doc du lieu cam bien CO2 va nhiet am tu thiet bi tren xe.'" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'AtmoCar can ket noi Bluetooth BLE voi cam bien buong lai xe.'" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AtmoCar can ket noi mang Wi-Fi de nhan du lieu thoi gian thuc tu ESP32.'" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string audio" "$INFO_PLIST" || true
          fi

          # 3. Tạo cấu hình build và Podfile chuẩn của Flutter
          flutter pub get
          flutter build ios --config-only

          # 4. Patch Podfile & project.pbxproj với Team giả lập và iOS 13+
          python3 ../.github/scripts/prepare_ios.py

          # 5. Cài đặt Pods
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release App
        working-directory: flutter_mobile_app
        run: |
          echo "Building iOS App..."
          flutter build ios --release --no-codesign || {
            echo "Direct flutter build blocked by signing check, compiling via xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          }

      - name: Package Payload into .IPA
        working-directory: flutter_mobile_app
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "Runner.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r AtmoCar-iOS.ipa Payload
          echo "IPA package created successfully!"
          ls -lh AtmoCar-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtmoCar-iOS-IPA
          path: flutter_mobile_app/AtmoCar-iOS.ipa
          retention-days: 14
