name: Build Android APK (AtmoCar)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_apk:
    name: Build Android APK on Ubuntu Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        working-directory: flutter_mobile_app
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Re-generating Android platform structure..."
            mkdir -p /tmp/backup_manifest
            cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/ || true
            rm -rf android
            flutter create . --platforms=android --org=com.atmocar
            cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Install Dependencies
        working-directory: flutter_mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: flutter_mobile_app
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtmoCar-Android-APK
          path: flutter_mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
